name: CI — PR Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build @wa-chat/shared first because dist/ is gitignored.
  # All jobs that import from it must download the artifact before running.
  prepare:
    name: Build shared package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build @wa-chat/shared
        run: npm run build --workspace packages/shared

      - name: Upload shared dist
        uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/
          retention-days: 1

  lint:
    name: Lint
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Type Check
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: Unit & Integration Tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          # Integration tests may need these; they should be set as repo secrets
          # for branches that need real service connectivity.
          # Unit tests run without any env vars.
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY || '' }}
          REDIS_URL: ${{ secrets.TEST_REDIS_URL || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/coverage/
            **/test-results/
          retention-days: 7

  build:
    name: Build
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shared dist
        uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist/

      - name: Build all workspaces
        run: npm run build
